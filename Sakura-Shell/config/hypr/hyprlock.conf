
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(05080f)
}

label {
    monitor =
    text = $TIME
    color = rgb(00e5ff)
    font_size = 90
    font_family = monospace
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(e2e2e9)
    font_size = 18
    font_family = monospace
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgb(00e5ff)
    inner_color = rgb(05080f)
    font_color = rgb(e2e2e9)
    fade_on_empty = false
    placeholder_text = <i>Enter password...</i>
    position = 0, -70
    halign = center
    valign = center
}
